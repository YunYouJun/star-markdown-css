name: Release

on:
  push:
    tags:
      - 'v*'
  # stage the current package.json version again without a new tag
  workflow_dispatch:

permissions:
  # changelogithub creates the GitHub release
  contents: write
  # npm Trusted Publishing (OIDC), no NPM_TOKEN needed
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set node
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          # Trusted Publishing requires npm >= 11.5.1
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - run: npx changelogithub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Trusted publishers may only stage; approve with 2FA on npmjs.com
      # or via `npm stage approve <stage-id>` to make the version live.
      - run: npm stage publish
